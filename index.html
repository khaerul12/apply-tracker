<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apply Tracker</title>
    <style>
        /* Menghilangkan scrollbar pada root */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0d0f14; /* Warna bg app kamu */
        }

        /* Container untuk membungkus iframe */
        .iframe-container {
            position: absolute;
            /* Trik: Geser ke atas sebesar 45px untuk menutupi banner Google */
            top: -45px; 
            left: 0;
            width: 100%;
            /* Tambahkan 45px pada tinggi agar bagian bawah tidak terpotong */
            height: calc(100% + 45px); 
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe src="https://script.google.com/macros/s/AKfycbzAjQefCzHqEWFqsa7S3tUKNC084Fl8Ckk2Z7-xRdv6tGZiVhZElsJo6DZ9-MKFCywc/exec"></iframe>
    </div>
</body>
</html>
